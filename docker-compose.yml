services:
  mysql:
    image: mysql:8.4
    container_name: sample-auth-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sample_auth
    ports:
      - "3306:3306"
    volumes:
      - sample-auth-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  sample-auth-data:
